[project]
name = "lowcode-agent-kit"
version = "0.1.0"
description = "Skills and read-only MCP adapters for EAP/OpenBPM and EXTN"
requires-python = ">=3.11"
dependencies = ["mcp>=2,<3"]

[project.scripts]
lowcode-mcp = "lowcode_agent_kit.mcp_server:main"
lowcode-install-skills = "lowcode_agent_kit.skill_installer:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lowcode_agent_kit"]
